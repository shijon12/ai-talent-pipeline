server:
  port: 8081

spring:
  application:
    name: ingestion-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pipeline_db
    username: postgres
    password: password123
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ingestion
  flyway:
    enabled: true
    create-schemas: true
    default-schema: ingestion
    schemas: ingestion
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  cloud:
    stream:
      bindings:
        candidateProducer-out-0:
          destination: candidate-events
          content-type: application/json
        lifecycleProducer-out-0:
          destination: candidate-lifecycle-events
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092
        bindings:
          candidateProducer-out-0:
            producer:
              sync: true
          lifecycleProducer-out-0:
            producer:
              sync: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
